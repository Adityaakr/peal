[package]
name = "peal-reveal-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Vara.eth program that computes AuctionKit reveal roots verifiably"
license = "Apache-2.0"

[dependencies]
sails-rs = { workspace = true, features = ["ethexe"] }
peal-reveal-engine-app.workspace = true

[build-dependencies]
sails-rs = { workspace = true, features = ["ethexe", "build"] }
peal-reveal-engine-app.workspace = true

# Its own workspace. The main peal workspace is edition 2021 on stable for
# native targets; this is edition 2024 targeting wasm32v1-none with no_std, and
# folding the two together would force one set of constraints onto both.
[workspace]
resolver = "3"
members = ["app"]

[workspace.dependencies]
sails-rs = "1.0.0-beta.2"
peal-reveal-engine-app = { version = "0.1.0", path = "app" }
