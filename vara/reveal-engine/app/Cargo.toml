[package]
name = "peal-reveal-engine-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Reveal-root computation for AuctionKit, as a Vara.eth program"
license = "Apache-2.0"

[dependencies]
sails-rs = { workspace = true, features = ["ethexe"] }
# Keccak-256, the hash Solidity uses. no_std, no allocator requirement.
tiny-keccak = { version = "2.0", default-features = false, features = ["keccak"] }
