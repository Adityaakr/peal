<!doctype html>

    <title>Peal Network. Sealed now, opened at the time you set.</title>
    <meta name="description" content="Lock a bid, a vote or a message so nobody can read it before the moment you choose. When that moment arrives it opens for everyone at once, in the same instant. Used for sealed bid auctions, encrypted mempools and private onchain actions." />
    <meta name="theme-color" content="#2563eb" />
    <meta property="og:title" content="Peal Network. Sealed now, opened at the time you set." />

    <!-- No og:image and no twitter:image on purpose: a link to Peal should
         unfurl as text. There is deliberately no <img> in this shell either,
         because a crawler with no image tag falls back to scraping the markup,
         and the header logo was being served as the preview: a transparent PNG
         that renders as a blank white slab in every chat client. The logo is a
         CSS background now, which crawlers do not read. -->
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/png" href="/peal-logo.png" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&family=DM+Sans:opsz,wght@9..40,400..700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
