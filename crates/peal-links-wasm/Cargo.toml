[package]
name = "peal-links-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen bindings for the Peal Links wallet: proving, receipt envelopes, backups (single-threaded)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No `parallel`, no `ledger`: the browser proves and encrypts, nothing else.
peal-bonsai = { path = "../peal-bonsai", default-features = false }
zkpari = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { workspace = true }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
