[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# The AuctionKit config struct has 22 snapshotted fields, which exhausts the
# legacy codegen's stack in initialize(). via-IR is the supported fix and is
# required for these contracts to compile at all.
via_ir = true

# The EIP-2537 precompiles do not exist in a bare EVM, so the BLS benchmark
# needs a fork of a chain that has them. Named here rather than pasted into
# each `forge test --fork-url`, so the target chain is a config change.
#
# Public endpoints, deliberately: nothing here needs a key, and a rate limit on
# a benchmark is not worth a secret in a config file. Override for real work
# with `forge test --fork-url <url>`, which takes precedence.
# Tempo charges ~1000 gas per byte of deployed code and 250k per new storage
# slot, and its eth_estimateGas does not account for either. SealedBidAuction is
# 15,409 bytes, so its code alone needs ~15.4M gas while the estimate comes back
# an order of magnitude under. A gas-estimate multiplier does not help, because
# a multiple of a wrong estimate is still wrong.
#
# Tempo's block limit is 500M, so an explicit ceiling well above any single
# deploy is safe and costs nothing: gas is charged on what is used, not on what
# is reserved.
gas_limit = 400000000

[rpc_endpoints]
# Tempo Moderato. ~0.5s deterministic BFT finality, EIP-2537 present, and
# gas is paid in pathUSD rather than a native token.
tempo = "https://rpc.moderato.tempo.xyz"
mainnet = "https://ethereum-rpc.publicnode.com"
