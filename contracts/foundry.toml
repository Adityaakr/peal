[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# The AuctionKit config struct has 22 snapshotted fields, which exhausts the
# legacy codegen's stack in initialize(). via-IR is the supported fix and is
# required for these contracts to compile at all.
via_ir = true

# The EIP-2537 precompiles do not exist in a bare EVM, so the BLS benchmark
# needs a fork of a chain that has them. Named here rather than pasted into
# each `forge test --fork-url`, so the target chain is a config change.
#
# Public endpoints, deliberately: nothing here needs a key, and a rate limit on
# a benchmark is not worth a secret in a config file. Override for real work
# with `forge test --fork-url <url>`, which takes precedence.
[rpc_endpoints]
hoodi = "https://rpc.hoodi.ethpandaops.io"
mainnet = "https://ethereum-rpc.publicnode.com"
