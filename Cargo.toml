[workspace]
resolver = "2"
members = [
    "crates/bte-crypto",
    "crates/bte-node",
    "crates/bte-coordinator",
    "crates/bte-cli",
    "crates/bte-wasm",
    "crates/peal-bonsai",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Adityaakr/batched-threshold-encryption"

[workspace.dependencies]
# Bonsai private payments: the ZK-Pari prototype with the payment circuits
# (R_send, R_recv, R_op), pinned at the head of upstream PR #2. Provenance in
# docs/peal-links/RESEARCH.md. Bump only with a decision record.
zkpari = { git = "https://github.com/guruvamsi-policharla/zk-pari", rev = "a8266aac58314214552a214fead1c0258f8de418", default-features = false, features = ["std", "circuits"] }
bte-crypto = { path = "crates/bte-crypto", features = ["full"] }
simple-bte = { package = "simple-batched-threshold-encryption", git = "https://github.com/commonwarexyz/simple-bte", rev = "147a08788f6c9b25b52dc58f03518ac30e94d5b8", default-features = false }
ark-bls12-381 = "0.6.0"
ark-ec = "0.6.0"
ark-ff = "0.6.0"
ark-serialize = "0.6.0"
ark-std = "0.6.0"
sha2 = "0.10"
thiserror = "2"
hex = "0.4"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# EIP-712 verification on the coordinator: keccak256 for the digest, k256 for
# ECDSA public-key recovery. Both are RustCrypto and already the de facto
# standard here; no hand-rolled curve arithmetic.
sha3 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[profile.dev]
opt-level = 3

[profile.release]
lto = "thin"
